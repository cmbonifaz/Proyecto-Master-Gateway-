name: Pipeline CI/CD DevSecOps

on:
  # Se ejecuta en PRs hacia 'test' para validación y merge automático
  pull_request:
    branches:
      - test
    types: [opened, synchronize, reopened]

# Declaración explícita de permisos necesarios para que GitHub CLI (gh) pueda operar sin usar actions de terceros
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ==============================================================================
  # JOB 1: GATEKEEPER DE SEGURIDAD (Analizador con Modelo Random Forest)
  # Corre en los servidores de GitHub — no necesita acceso a red local
  # ==============================================================================
  gatekeeper-security-check:
    name: "Análisis de Seguridad ML (Gatekeeper)"
    runs-on: ubuntu-latest
    env:
      # Token necesario para autenticar la CLI de GitHub
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Notificar inicio de revisión de seguridad
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="⏳ [JOB 1/4] INICIO: Análisis ML de seguridad para el PR #${{ github.event.pull_request.number }}."

      - name: Setup de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del modelo de ML
        run: |
          python -m pip install --upgrade pip
          # IMPORTANTE: versión exacta de scikit-learn = la misma con la que se entrenó el modelo
          pip install "scikit-learn==1.8.0" "numpy>=1.24.0" "scipy>=1.11.0" joblib pandas

      - name: Extraer cambios del Pull Request (diff)
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > cambios.diff
          echo "Diff extraído correctamente."

      - name: Ejecutar Análisis de Seguridad (Inferencia ML)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python scripts/analizador_ci.py cambios.diff

      # ── NOTIFICAR RESUMEN DE ANÁLISIS ML A TELEGRAM ──
      - name: Notificar resumen de análisis ML a Telegram
        if: always() && !cancelled()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, urllib.request, urllib.parse
          token = os.environ.get('TELEGRAM_TOKEN')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID')
          if os.path.exists('telegram_resumen.txt'):
              with open('telegram_resumen.txt', 'r', encoding='utf-8') as f:
                  text = f.read()
              data = urllib.parse.urlencode({'chat_id': chat_id, 'text': text}).encode('utf-8')
              urllib.request.urlopen(f'https://api.telegram.org/bot{token}/sendMessage', data=data)
          "

      # ── MANEJO DE FALLO (SE DETECTÓ CÓDIGO VULNERABLE) ──
      - name: Acciones correctivas ante código VULNERABLE
        if: failure()
        run: |
          echo "Ejecutando protocolo de bloqueo de Pull Request..."

          # 1. Comentar en el PR con el reporte generado por el analizador
          gh pr comment ${{ github.event.pull_request.number }} --body-file reporte_seguridad.txt

          # 2. Aplicar etiqueta 'fixing-required' al PR
          gh label create "fixing-required" --color "e11d48" --description "Código vulnerable detectado — revisión obligatoria" || true
          gh pr edit ${{ github.event.pull_request.number }} --add-label "fixing-required"

          # 3. Cerrar el Pull Request de forma inmediata
          gh pr close ${{ github.event.pull_request.number }}

          # 4. Crear un Issue para revisión obligatoria del equipo
          gh issue create --title "Vulnerabilidad detectada en PR #${{ github.event.pull_request.number }}" --body-file reporte_seguridad.txt

          # 5. Enviar notificación urgente a Telegram
          MSG="🚨 [JOB 1/4] ALERTA CRÍTICA: PR #${{ github.event.pull_request.number }} BLOQUEADO por código vulnerable. Revisar Issue creado en el repositorio."
          if [ -f telegram_msg.txt ]; then
            MSG=$(cat telegram_msg.txt)
          fi
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$MSG"

      # ── MANEJO DE ÉXITO (EL CÓDIGO ES SEGURO) ──
      - name: Notificar éxito de seguridad ML
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ [JOB 1/4] GATEKEEPER PASS: El código del PR #${{ github.event.pull_request.number }} es seguro. Iniciando análisis SonarQube..."

  # ==============================================================================
  # JOB 2: ANÁLISIS ESTÁTICO CON SONARQUBE COMMUNITY (Self-Hosted Runner)
  # Corre en TU MÁQUINA LOCAL donde SonarQube está en http://localhost:9000
  # No necesita exposición a internet — el runner accede directamente a localhost
  # Las notificaciones de Telegram se envían con Invoke-WebRequest (PowerShell)
  # ya que el runner es Windows y el 'curl' nativo de Linux no está disponible.
  # ==============================================================================
  sonarqube-analysis:
    name: "Análisis SAST SonarQube Community"
    needs: gatekeeper-security-check
    runs-on: self-hosted

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          # Necesario para que SonarQube pueda calcular blame y blame-aware issues
          fetch-depth: 0

      - name: Notificar inicio del análisis SonarQube
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $json = "{`"chat_id`":`"$env:TELEGRAM_CHAT_ID`",`"text`":`"[JOB 2/4] INICIO: Analisis SAST con SonarQube para el PR #$env:PR_NUMBER.`"}"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          Invoke-WebRequest -Uri "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage" `
            -Method POST -Body $bytes -ContentType "application/json; charset=utf-8" -UseBasicParsing | Out-Null

      # ── GENERAR COBERTURA ANTES DEL SCAN ─────────────────────────────────────
      # El coverage.xml debe existir ANTES de que el scanner arranque,
      # de lo contrario SonarQube reporta "No report found".
      - name: Instalar Python y dependencias para cobertura
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar reporte de cobertura (pytest-cov)
        shell: powershell
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: "test-secret-for-ci-only"
          JWT_ALGORITHM: "HS256"
          TEMP_TOKEN_EXPIRE_MINUTES: "5"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
        run: |
          cd backend
          pip install -r requirements.txt --quiet
          pytest tests/ -v --tb=short `
            --cov=app `
            --cov-report=xml:coverage.xml `
            --cov-report=term-missing
          # Mover el reporte a la raiz para que el scanner lo encuentre
          Move-Item -Path coverage.xml -Destination ../backend/coverage.xml -Force -ErrorAction SilentlyContinue

      - name: Ejecutar SonarQube Scanner
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          skipSignatureVerification: true
          args: >
            -Dsonar.projectKey=Master-Gateway
            -Dsonar.projectName="Master-Gateway"
            -Dsonar.sources=backend/app
            -Dsonar.tests=backend/tests
            -Dsonar.python.version=3.11
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.exclusions=**/alembic/**,**/__pycache__/**,**/*.pyc,**/pipeline/**

      - name: Verificar Quality Gate de SonarQube (PowerShell)
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{ Authorization = "Bearer $env:SONAR_TOKEN" }
          $serverUrl = $env:SONAR_HOST_URL

          # Leer el ceTaskId generado por el scanner
          $reportFile = ".scannerwork/report-task.txt"
          $content = Get-Content $reportFile
          $ceTaskId = ($content | Where-Object { $_ -match "^ceTaskId=" }) -replace "^ceTaskId=", ""
          Write-Host "Task ID: $ceTaskId"

          # Esperar hasta que el análisis termine (máx 5 minutos)
          $timeout = 300
          $start = Get-Date
          do {
            Start-Sleep -Seconds 5
            $task = Invoke-RestMethod -Uri "$serverUrl/api/ce/task?id=$ceTaskId" -Headers $headers
            $taskStatus = $task.task.status
            Write-Host "Análisis en progreso... Estado: $taskStatus"
            if (((Get-Date) - $start).TotalSeconds -gt $timeout) {
              Write-Error "Timeout: el análisis de SonarQube tardó más de 5 minutos."
              exit 1
            }
          } while ($taskStatus -eq "PENDING" -or $taskStatus -eq "IN_PROGRESS")

          if ($taskStatus -ne "SUCCESS") {
            Write-Error "El análisis de SonarQube falló con estado: $taskStatus"
            exit 1
          }

          # Verificar el Quality Gate
          $analysisId = $task.task.analysisId
          $qg = Invoke-RestMethod -Uri "$serverUrl/api/qualitygates/project_status?analysisId=$analysisId" -Headers $headers
          $qgStatus = $qg.projectStatus.status
          Write-Host "Quality Gate: $qgStatus"

          # Extraer métricas de forma segura
          $secIssues = ($qg.projectStatus.conditions | Where-Object { $_.metricKey -eq "software_quality_security_issues" }).actualValue
          if (-not $secIssues) { $secIssues = "0" }

          $relIssues = ($qg.projectStatus.conditions | Where-Object { $_.metricKey -eq "software_quality_reliability_issues" }).actualValue
          if (-not $relIssues) { $relIssues = "0" }

          $maintIssues = ($qg.projectStatus.conditions | Where-Object { $_.metricKey -eq "software_quality_maintainability_issues" }).actualValue
          if (-not $maintIssues) { $maintIssues = "0" }

          $coverageVal = ($qg.projectStatus.conditions | Where-Object { $_.metricKey -eq "coverage" }).actualValue
          if (-not $coverageVal) { $coverageVal = "N/D" }

          $duplVal = ($qg.projectStatus.conditions | Where-Object { $_.metricKey -eq "duplicated_lines_density" }).actualValue
          if (-not $duplVal) { $duplVal = "0%" }

          $shortSha = $env:GITHUB_SHA
          if ($shortSha -and $shortSha.Length -ge 7) { $shortSha = $shortSha.Substring(0, 7) }

          $summaryText = @"
[INFORME SAST - SONARQUBE COMMUNITY]
Informe automatico generado por SonarQube v26.6

------------------------------------
RESUMEN DEL EVENTO
Autor: $env:GITHUB_ACTOR
PR: #$env:PR_NUMBER ($env:GITHUB_HEAD_REF -> $env:GITHUB_BASE_REF)
Commit: $shortSha
Quality Gate: $qgStatus

------------------------------------
METRICAS EVALUADAS
Security Issues: $secIssues (Max: 0)
Reliability Issues: $relIssues (Max: 5)
Maintainability Issues: $maintIssues (Max: 15)
Coverage: $coverageVal% (Min: 60%)
Duplication: $duplVal% (Max: 10%)

------------------------------------
ENLACES
Dashboard: $serverUrl/dashboard?id=Master-Gateway
Commit: https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA
"@

          # Enviar resumen del análisis a Telegram en UTF-8 sin emojis
          $jsonSummary = @{
              chat_id = $env:TELEGRAM_CHAT_ID
              text = $summaryText
          } | ConvertTo-Json

          $bytesSummary = [System.Text.Encoding]::UTF8.GetBytes($jsonSummary)
          Invoke-WebRequest -Uri "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage" `
            -Method POST -Body $bytesSummary -ContentType "application/json; charset=utf-8" -UseBasicParsing | Out-Null

          if ($qgStatus -ne "OK") {
            Write-Error "FALLO: Quality Gate no superado ($qgStatus). Revisar $serverUrl/dashboard?id=Master-Gateway"
            exit 1
          }
          Write-Host "✅ Quality Gate APROBADO"

      # ── MANEJO DE ÉXITO: Quality Gate pasado ──
      - name: Notificar SonarQube PASS a Telegram
        if: success()
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $json = "{`"chat_id`":`"$env:TELEGRAM_CHAT_ID`",`"text`":`"[JOB 2/4] SONARQUBE PASS: Quality Gate superado en el PR #$env:PR_NUMBER. Sin deuda tecnica critica. Iniciando pruebas funcionales...`"}"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          Invoke-WebRequest -Uri "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage" `
            -Method POST -Body $bytes -ContentType "application/json; charset=utf-8" -UseBasicParsing | Out-Null

      # ── MANEJO DE FALLO: Quality Gate no pasó ──
      - name: Notificar SonarQube FAIL a Telegram
        if: failure()
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $json = "{`"chat_id`":`"$env:TELEGRAM_CHAT_ID`",`"text`":`"[JOB 2/4] SONARQUBE FAIL: El Quality Gate NO fue superado en el PR #$env:PR_NUMBER. Revisar el dashboard de SonarQube.`"}"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          Invoke-WebRequest -Uri "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage" `
            -Method POST -Body $bytes -ContentType "application/json; charset=utf-8" -UseBasicParsing | Out-Null

  # ==============================================================================
  # JOB 3: MERGE AUTOMÁTICO Y PRUEBAS FUNCIONALES
  # Corre después del Gatekeeper ML Y del SonarQube (ambos deben pasar)
  # ==============================================================================
  auto-merge-and-test:
    name: "Merge a Test y Pytest"
    needs: [gatekeeper-security-check, sonarqube-analysis]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup de Python 3.11 para pruebas
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias funcionales y pytest
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Ejecutar pruebas unitarias (Pytest)
        run: |
          cd backend
          pytest tests/ -v --tb=short \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
        env:
          # Tests usan SQLite en memoria — no necesitan la DATABASE_URL real de Supabase
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: "test-secret-for-ci-only"
          JWT_ALGORITHM: "HS256"
          TEMP_TOKEN_EXPIRE_MINUTES: "5"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"

      # ── NOTIFICAR RESUMEN DE PRUEBAS PYTEST ──
      - name: Notificar resumen de pruebas Pytest a Telegram
        if: always() && !cancelled()
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          HEAD_REF="${{ github.head_ref }}"
          BASE_REF="${{ github.base_ref }}"
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ACTOR="${{ github.actor }}"
          
          SUMMARY="🧪 RESUMEN DE PRUEBAS FUNCIONALES (PYTEST)
Informe de Ejecución de Pruebas Unitarias

━━━━━━━━━━━━━━━━━━━━
📌 Resumen del evento
Autor: ${ACTOR}
PR: #${PR_NUM} (${HEAD_REF} -> ${BASE_REF})
Commit: ${SHA}

━━━━━━━━━━━━━━━━━━━━
📊 Detalles de Ejecución
- Entorno BD: SQLite Async (en memoria)
- Módulos probados: Auth, Users, Roles, Menus
- Cobertura de Código: Reporte generado (coverage.xml)

━━━━━━━━━━━━━━━━━━━━
🔗 Enlaces
- Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$SUMMARY"

      # ── MANEJO DE FALLO EN PRUEBAS ──
      - name: Notificar fallo de pruebas a Telegram
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ [JOB 3/4] ERROR PYTEST: Las pruebas funcionales fallaron en el PR #${{ github.event.pull_request.number }}."
          gh label create "tests-failed" --color "d73a4a" --description "Pruebas funcionales fallidas" || true
          gh pr edit ${{ github.event.pull_request.number }} --add-label "tests-failed"

      # ── MANEJO DE ÉXITO EN PRUEBAS Y MERGE ──
      - name: Notificar éxito de pruebas y realizar merge
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ [JOB 3/4] PYTEST PASS: Todas las pruebas pasaron para el PR #${{ github.event.pull_request.number }}. Realizando merge en test..."

          # Activar auto-merge para fusionar una vez que este check finalice con éxito
          gh pr merge ${{ github.event.pull_request.number }} --auto --merge

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="🔄 [JOB 3/4] MERGE REALIZADO: PR #${{ github.event.pull_request.number }} fusionado en rama 'test'. Iniciando promoción a main..."

  # ==============================================================================
  # JOB 4: PROMOCIÓN A MAIN
  # Fusiona la rama 'test' en 'main' tras superar todo el pipeline.
  # No hay despliegue a Render — el merge a main es el paso final.
  # ==============================================================================
  promote-to-main:
    name: "Promoción a Main"
    needs: auto-merge-and-test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout de la rama 'test'
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Crear y fusionar Pull Request hacia 'main'
        run: |
          # Intentar crear el PR de test → main; si ya existe, ignorar el error
          gh pr create \
            --base main \
            --head test \
            --title "chore: Promoción a main — $(date +'%Y-%m-%d %H:%M')" \
            --body "Merge automático desde 'test' tras superar pipeline completo (ML Gatekeeper + SonarQube + Pytest)." \
            || true

          # Obtener el número del PR activo entre test y main
          PR_NUMBER=$(gh pr list --state open --base main --head test --json number --jq '.[0].number')

          # Fusionar el PR con merge commit
          gh pr merge $PR_NUMBER --merge --admin

      - name: Notificación final de Promoción Exitosa
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="🎉 [JOB 4/4] PIPELINE COMPLETADO: PR #${{ github.event.pull_request.number }} superó todos los controles (ML + SonarQube + Pytest) y fue fusionado exitosamente en 'main'."

      - name: Notificación de Promoción Fallida
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ [JOB 4/4] ERROR EN PROMOCIÓN: Falló la fusión de 'test' hacia 'main' para el PR #${{ github.event.pull_request.number }}. Revisar Actions."
