name: Pipeline CI/CD DevSecOps

on:
  # Se ejecuta en PRs hacia 'test' para validación y merge automático
  pull_request:
    branches:
      - test
    types: [opened, synchronize, reopened]

# Declaración explícita de permisos necesarios para que GitHub CLI (gh) pueda operar sin usar actions de terceros
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ==============================================================================
  # JOB 1: GATEKEEPER DE SEGURIDAD (Analizador con Modelo Random Forest)
  # Corre en los servidores de GitHub — no necesita acceso a red local
  # ==============================================================================
  gatekeeper-security-check:
    name: "🤖 Análisis de Seguridad ML (Gatekeeper)"
    runs-on: ubuntu-latest
    env:
      # Token necesario para autenticar la CLI de GitHub
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Notificar inicio de revisión de seguridad
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="⏳ [JOB 1/4] INICIO: Análisis ML de seguridad para el PR #${{ github.event.pull_request.number }}."

      - name: Setup de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del modelo de ML
        run: |
          python -m pip install --upgrade pip
          # IMPORTANTE: versión exacta de scikit-learn = la misma con la que se entrenó el modelo
          pip install "scikit-learn==1.8.0" "numpy>=1.24.0" "scipy>=1.11.0" joblib pandas

      - name: Extraer cambios del Pull Request (diff)
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > cambios.diff
          echo "Diff extraído correctamente."

      - name: Ejecutar Análisis de Seguridad (Inferencia ML)
        run: |
          python scripts/analizador_ci.py cambios.diff

      # ── ENVIAR RESUMEN DEL ANÁLISIS ML A TELEGRAM ──
      - name: Enviar resumen del análisis ML a Telegram
        if: always()
        run: |
          if [ -f telegram_summary.txt ]; then
            SUMMARY=$(cat telegram_summary.txt)
          else
            SUMMARY="[JOB 1/4] RESUMEN ML GATEKEEPER\n---\nNo se pudo generar el resumen del analisis."
          fi
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode text="$SUMMARY"

      # ── MANEJO DE FALLO (SE DETECTÓ CÓDIGO VULNERABLE) ──
      - name: Acciones correctivas ante código VULNERABLE
        if: failure()
        run: |
          echo "Ejecutando protocolo de bloqueo de Pull Request..."

          # 1. Comentar en el PR con el reporte generado por el analizador
          gh pr comment ${{ github.event.pull_request.number }} --body-file reporte_seguridad.txt

          # 2. Aplicar etiqueta 'fixing-required' al PR
          gh label create "fixing-required" --color "e11d48" --description "Código vulnerable detectado — revisión obligatoria" || true
          gh pr edit ${{ github.event.pull_request.number }} --add-label "fixing-required"

          # 3. Cerrar el Pull Request de forma inmediata
          gh pr close ${{ github.event.pull_request.number }}

          # 4. Crear un Issue para revisión obligatoria del equipo
          gh issue create --title "Vulnerabilidad detectada en PR #${{ github.event.pull_request.number }}" --body-file reporte_seguridad.txt

          # 5. Enviar notificación urgente a Telegram
          MSG="[JOB 1/4] ALERTA CRITICA: PR #${{ github.event.pull_request.number }} BLOQUEADO por codigo vulnerable. Revisar Issue creado en el repositorio."
          if [ -f telegram_msg.txt ]; then
            MSG=$(cat telegram_msg.txt)
          fi
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode text="$MSG"

      # ── MANEJO DE ÉXITO (EL CÓDIGO ES SEGURO) ──
      - name: Notificar éxito de seguridad ML
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="[JOB 1/4] GATEKEEPER PASS: El codigo del PR #${{ github.event.pull_request.number }} es seguro. Iniciando analisis SonarQube..."

  # ==============================================================================
  # JOB 2: ANÁLISIS ESTÁTICO CON SONARQUBE COMMUNITY (Self-Hosted Runner)
  # Corre en TU MÁQUINA LOCAL donde SonarQube está en http://localhost:9000
  # No necesita exposición a internet — el runner accede directamente a localhost
  # Las notificaciones de Telegram se envían con Invoke-WebRequest (PowerShell)
  # ya que el runner es Windows y el 'curl' nativo de Linux no está disponible.
  # ==============================================================================
  sonarqube-analysis:
    name: "🔍 Análisis SAST SonarQube Community"
    needs: gatekeeper-security-check
    runs-on: self-hosted

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          # Necesario para que SonarQube pueda calcular blame y blame-aware issues
          fetch-depth: 0

      - name: Notificar inicio del análisis SonarQube
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $json = "{`"chat_id`":`"$env:TELEGRAM_CHAT_ID`",`"text`":`"[JOB 2/4] INICIO: Analisis SAST con SonarQube para el PR #$env:PR_NUMBER.`"}"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          Invoke-WebRequest -Uri "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage" `
            -Method POST -Body $bytes -ContentType "application/json; charset=utf-8" -UseBasicParsing | Out-Null

      # ── GENERAR COBERTURA ANTES DEL SCAN ─────────────────────────────────────
      # El coverage.xml debe existir ANTES de que el scanner arranque,
      # de lo contrario SonarQube reporta "No report found".
      - name: Instalar Python y dependencias para cobertura
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar reporte de cobertura (pytest-cov)
        shell: powershell
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: "test-secret-for-ci-only"
          JWT_ALGORITHM: "HS256"
          TEMP_TOKEN_EXPIRE_MINUTES: "5"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
        run: |
          cd backend
          pip install -r requirements.txt --quiet
          pytest tests/ -v --tb=short `
            --cov=app `
            --cov-report=xml:coverage.xml `
            --cov-report=term-missing
          # Mover el reporte a la raiz para que el scanner lo encuentre
          Move-Item -Path coverage.xml -Destination ../backend/coverage.xml -Force -ErrorAction SilentlyContinue

      - name: Ejecutar SonarQube Scanner
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          skipSignatureVerification: true
          args: >
            -Dsonar.projectKey=Master-Gateway
            -Dsonar.projectName="Master-Gateway"
            -Dsonar.sources=backend/app
            -Dsonar.tests=backend/tests
            -Dsonar.python.version=3.11
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.exclusions=**/alembic/**,**/__pycache__/**,**/*.pyc,**/pipeline/**

      - name: Verificar Quality Gate y recopilar metricas SonarQube (PowerShell)
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          $headers = @{ Authorization = "Bearer $env:SONAR_TOKEN" }
          $serverUrl = $env:SONAR_HOST_URL

          # Leer el ceTaskId generado por el scanner
          $reportFile = ".scannerwork/report-task.txt"
          $content = Get-Content $reportFile
          $ceTaskId = ($content | Where-Object { $_ -match "^ceTaskId=" }) -replace "^ceTaskId=", ""
          Write-Host "Task ID: $ceTaskId"

          # Esperar hasta que el analisis termine (max 5 minutos)
          $timeout = 300
          $start = Get-Date
          do {
            Start-Sleep -Seconds 5
            $task = Invoke-RestMethod -Uri "$serverUrl/api/ce/task?id=$ceTaskId" -Headers $headers
            $taskStatus = $task.task.status
            Write-Host "Analisis en progreso... Estado: $taskStatus"
            if (((Get-Date) - $start).TotalSeconds -gt $timeout) {
              Write-Error "Timeout: el analisis de SonarQube tardo mas de 5 minutos."
              exit 1
            }
          } while ($taskStatus -eq "PENDING" -or $taskStatus -eq "IN_PROGRESS")

          if ($taskStatus -ne "SUCCESS") {
            Write-Error "El analisis de SonarQube fallo con estado: $taskStatus"
            exit 1
          }

          # Verificar el Quality Gate
          $analysisId = $task.task.analysisId
          $qg = Invoke-RestMethod -Uri "$serverUrl/api/qualitygates/project_status?analysisId=$analysisId" -Headers $headers
          $qgStatus = $qg.projectStatus.status
          Write-Host "Quality Gate: $qgStatus"

          # Consultar metricas del proyecto via API de SonarQube
          $metricsToFetch = "bugs,vulnerabilities,code_smells,coverage,new_coverage,duplicated_lines_density,ncloc,security_rating,reliability_rating,sqale_rating"
          $metricsUrl = "$serverUrl/api/measures/component?component=Master-Gateway&metricKeys=$metricsToFetch"
          $metricsResp = Invoke-RestMethod -Uri $metricsUrl -Headers $headers
          $measures = $metricsResp.component.measures

          # Funcion para extraer valor de una metrica (overall)
          function Get-Measure($name) {
            $m = $measures | Where-Object { $_.metric -eq $name }
            if ($m -and $m.value) { return $m.value } else { return "N/D" }
          }

          # Funcion para extraer valor de metrica de nuevo codigo (periods[0].value)
          function Get-NewMeasure($name) {
            $m = $measures | Where-Object { $_.metric -eq $name }
            if ($m -and $m.periods -and $m.periods.Count -gt 0) { return $m.periods[0].value } else { return "N/D" }
          }

          # Funcion para convertir rating numerico a letra (1=A ... 5=E)
          function Rating-Letter($val) {
            switch ($val) {
              "1" { return "A" }; "2" { return "B" }; "3" { return "C" }
              "4" { return "D" }; "5" { return "E" }; default { return "N/D" }
            }
          }

          $bugs        = Get-Measure "bugs"
          $vulns       = Get-Measure "vulnerabilities"
          $smells      = Get-Measure "code_smells"
          $coverage    = Get-Measure "coverage"
          $newCoverage = Get-NewMeasure "new_coverage"
          $duplication = Get-Measure "duplicated_lines_density"
          $ncloc       = Get-Measure "ncloc"
          $secRating   = Rating-Letter (Get-Measure "security_rating")
          $relRating   = Rating-Letter (Get-Measure "reliability_rating")
          $manRating   = Rating-Letter (Get-Measure "sqale_rating")

          $qgLabel  = if ($qgStatus -eq "OK") { "APROBADO" } else { "RECHAZADO ($qgStatus)" }
          $decision = if ($qgStatus -eq "OK") { "APROBADO - Quality Gate superado" } else { "RECHAZADO - Quality Gate no superado" }
          $coverageDisplay    = if ($coverage -ne "N/D") { "$coverage%" } else { "N/D" }
          $newCoverageDisplay = if ($newCoverage -ne "N/D") { "$newCoverage%" } else { "N/D" }
          $duplicationDisplay = if ($duplication -ne "N/D") { "$duplication%" } else { "N/D" }

          $summaryLines = @(
            "[JOB 2/4] RESUMEN SONARQUBE",
            "---",
            "Proyecto: Master-Gateway",
            "Quality Gate: $qgLabel",
            "---",
            "Metricas de codigo:",
            "Bugs: $bugs",
            "Vulnerabilidades: $vulns",
            "Code Smells: $smells",
            "Lineas de codigo: $ncloc",
            "Cobertura (codigo nuevo): $newCoverageDisplay  <- QG verifica esta",
            "Cobertura (global): $coverageDisplay",
            "Duplicacion: $duplicationDisplay",
            "---",
            "Ratings de calidad:",
            "Seguridad: $secRating",
            "Fiabilidad: $relRating",
            "Mantenibilidad: $manRating",
            "---",
            "Decision: $decision"
          )
          $summaryText = $summaryLines -join "`n"
          [System.IO.File]::WriteAllText("sonar_summary.txt", $summaryText, [System.Text.Encoding]::UTF8)
          Write-Host "Resumen SonarQube guardado en sonar_summary.txt"

          if ($qgStatus -ne "OK") {
            Write-Error "FALLO: Quality Gate no superado ($qgStatus). Revisar $serverUrl/dashboard?id=Master-Gateway"
            exit 1
          }
          Write-Host "Quality Gate APROBADO"

      # ── ENVIAR RESUMEN SONARQUBE A TELEGRAM (siempre, antes del PASS/FAIL) ──
      - name: Enviar resumen SonarQube a Telegram
        if: always()
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if (Test-Path "sonar_summary.txt") {
            $summaryText = [System.IO.File]::ReadAllText("sonar_summary.txt", [System.Text.Encoding]::UTF8)
          } else {
            $summaryText = "[JOB 2/4] RESUMEN SONARQUBE`n---`nNo se pudo generar el resumen del analisis."
          }
          $body = @{ chat_id = $env:TELEGRAM_CHAT_ID; text = $summaryText } | ConvertTo-Json -Compress
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($body)
          Invoke-WebRequest -Uri "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage" `
            -Method POST -Body $bytes -ContentType "application/json; charset=utf-8" -UseBasicParsing | Out-Null

      # ── MANEJO DE EXITO: Quality Gate pasado ──
      - name: Notificar SonarQube PASS a Telegram
        if: success()
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $json = "{`"chat_id`":`"$env:TELEGRAM_CHAT_ID`",`"text`":`"[JOB 2/4] SONARQUBE PASS: Quality Gate superado en el PR #$env:PR_NUMBER. Sin deuda tecnica critica. Iniciando pruebas funcionales...`"}"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          Invoke-WebRequest -Uri "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage" `
            -Method POST -Body $bytes -ContentType "application/json; charset=utf-8" -UseBasicParsing | Out-Null

      # ── MANEJO DE FALLO: Quality Gate no paso ──
      - name: Notificar SonarQube FAIL a Telegram
        if: failure()
        shell: powershell
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $json = "{`"chat_id`":`"$env:TELEGRAM_CHAT_ID`",`"text`":`"[JOB 2/4] SONARQUBE FAIL: El Quality Gate NO fue superado en el PR #$env:PR_NUMBER. Revisar el dashboard de SonarQube.`"}"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          Invoke-WebRequest -Uri "https://api.telegram.org/bot$env:TELEGRAM_TOKEN/sendMessage" `
            -Method POST -Body $bytes -ContentType "application/json; charset=utf-8" -UseBasicParsing | Out-Null

  # ==============================================================================
  # JOB 3: MERGE AUTOMÁTICO Y PRUEBAS FUNCIONALES
  # Corre después del Gatekeeper ML Y del SonarQube (ambos deben pasar)
  # ==============================================================================
  auto-merge-and-test:
    name: "🧪 Merge a Test y Pytest"
    needs: [gatekeeper-security-check, sonarqube-analysis]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup de Python 3.11 para pruebas
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias funcionales y pytest
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Ejecutar pruebas unitarias (Pytest)
        run: |
          set -o pipefail
          cd backend
          # Ejecutar pytest y capturar salida completa; pipefail asegura que el exit code de pytest se propague
          pytest tests/ -v --tb=short \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing 2>&1 | tee ../pytest_output.txt
        env:
          # Tests usan SQLite en memoria — no necesitan la DATABASE_URL real de Supabase
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: "test-secret-for-ci-only"
          JWT_ALGORITHM: "HS256"
          TEMP_TOKEN_EXPIRE_MINUTES: "5"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"

      # ── GENERAR RESUMEN DE PYTEST PARA TELEGRAM ──
      - name: Generar resumen de Pytest para Telegram
        if: always()
        run: |
          OUTPUT_FILE="pytest_output.txt"
          SUMMARY_FILE="pytest_summary.txt"

          if [ ! -f "$OUTPUT_FILE" ]; then
            printf '%s\n' "[JOB 3/4] RESUMEN PYTEST" "---" "No se pudo capturar la salida de pytest." > "$SUMMARY_FILE"
            exit 0
          fi

          # Contar tests desde la linea de resumen final de pytest
          # Formato: "= X passed, Y failed, Z error in T.XXs ="
          SUMMARY_LINE=$(grep -E "[0-9]+ passed|[0-9]+ failed|[0-9]+ error" "$OUTPUT_FILE" | grep -E "==" | tail -1)
          PASSED=$(echo "$SUMMARY_LINE" | grep -oE "[0-9]+ passed" | grep -oE "[0-9]+" || echo "0")
          FAILED=$(echo "$SUMMARY_LINE" | grep -oE "[0-9]+ failed" | grep -oE "[0-9]+" || echo "0")
          ERROR_COUNT=$(echo "$SUMMARY_LINE" | grep -oE "[0-9]+ error" | grep -oE "[0-9]+" || echo "0")
          PASSED=${PASSED:-0}; FAILED=${FAILED:-0}; ERROR_COUNT=${ERROR_COUNT:-0}
          TOTAL=$((PASSED + FAILED + ERROR_COUNT))

          # Extraer porcentaje de cobertura total (linea TOTAL del reporte de pytest-cov)
          COVERAGE=$(grep -E "^TOTAL" "$OUTPUT_FILE" | awk '{print $NF}' | tail -1)
          if [ -z "$COVERAGE" ]; then
            COVERAGE="N/D"
          fi

          # Determinar decision
          if [ "$FAILED" -gt 0 ] || [ "$ERROR_COUNT" -gt 0 ]; then
            DECISION="RECHAZADO - Hay pruebas fallidas"
            QG_STATUS="FALLIDO"
          else
            DECISION="APROBADO - Todas las pruebas pasaron"
            QG_STATUS="APROBADO"
          fi

          # Extraer nombres de tests fallidos del resumen final de pytest (max 5)
          # En pytest verbose, el resumen tiene lineas: "FAILED tests/x.py::test_y - reason"
          FAILED_TESTS=$(grep -E "^FAILED " "$OUTPUT_FILE" | head -5 | sed 's/^FAILED /  - /' || true)

          {
            echo "[JOB 3/4] RESUMEN PYTEST"
            echo "---"
            echo "Estado general: $QG_STATUS"
            echo "---"
            echo "Resultados de pruebas:"
            echo "Total: $TOTAL"
            echo "Pasaron: $PASSED"
            echo "Fallaron: $FAILED"
            echo "Errores: $ERROR_COUNT"
            echo "---"
            echo "Cobertura de codigo: $COVERAGE"
            echo "---"
            if [ "$FAILED" -gt 0 ] || [ "$ERROR_COUNT" -gt 0 ]; then
              echo "Tests fallidos:"
              echo "$FAILED_TESTS"
              echo "---"
            fi
            echo "Decision: $DECISION"
          } > "$SUMMARY_FILE"

      # ── ENVIAR RESUMEN PYTEST A TELEGRAM (siempre, antes del PASS/FAIL) ──
      - name: Enviar resumen Pytest a Telegram
        if: always()
        run: |
          if [ -f pytest_summary.txt ]; then
            SUMMARY=$(cat pytest_summary.txt)
          else
            SUMMARY=$(printf '%s\n' "[JOB 3/4] RESUMEN PYTEST" "---" "No se pudo generar el resumen del analisis.")
          fi
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode text="$SUMMARY"


      # ── MANEJO DE FALLO EN PRUEBAS ──
      - name: Notificar fallo de pruebas a Telegram
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="[JOB 3/4] ERROR PYTEST: Las pruebas funcionales fallaron en el PR #${{ github.event.pull_request.number }}."
          gh label create "tests-failed" --color "d73a4a" --description "Pruebas funcionales fallidas" || true
          gh pr edit ${{ github.event.pull_request.number }} --add-label "tests-failed"

      # ── MANEJO DE EXITO EN PRUEBAS Y MERGE ──
      - name: Notificar exito de pruebas y realizar merge
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="[JOB 3/4] PYTEST PASS: Todas las pruebas pasaron para el PR #${{ github.event.pull_request.number }}. Realizando merge en test..."

          # Activar auto-merge para fusionar una vez que este check finalice con exito
          gh pr merge ${{ github.event.pull_request.number }} --auto --merge

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="[JOB 3/4] MERGE REALIZADO: PR #${{ github.event.pull_request.number }} fusionado en rama 'test'. Iniciando promocion a main..."

  # ==============================================================================
  # JOB 4: PROMOCIÓN A MAIN
  # Fusiona la rama 'test' en 'main' tras superar todo el pipeline.
  # No hay despliegue a Render — el merge a main es el paso final.
  # ==============================================================================
  promote-to-main:
    name: "🚀 Promoción a Main"
    needs: auto-merge-and-test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout de la rama 'test'
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Crear y fusionar Pull Request hacia 'main'
        run: |
          # Intentar crear el PR de test → main; si ya existe, ignorar el error
          gh pr create \
            --base main \
            --head test \
            --title "chore: Promoción a main — $(date +'%Y-%m-%d %H:%M')" \
            --body "Merge automático desde 'test' tras superar pipeline completo (ML Gatekeeper + SonarQube + Pytest)." \
            || true

          # Obtener el número del PR activo entre test y main
          PR_NUMBER=$(gh pr list --state open --base main --head test --json number --jq '.[0].number')

          # Fusionar el PR con merge commit
          gh pr merge $PR_NUMBER --merge --admin

      - name: Notificación final de Promoción Exitosa
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="🎉 [JOB 4/4] PIPELINE COMPLETADO: PR #${{ github.event.pull_request.number }} superó todos los controles (ML + SonarQube + Pytest) y fue fusionado exitosamente en 'main'."

      - name: Notificación de Promoción Fallida
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ [JOB 4/4] ERROR EN PROMOCIÓN: Falló la fusión de 'test' hacia 'main' para el PR #${{ github.event.pull_request.number }}. Revisar Actions."
