# =============================================================================
# sonar-project.properties
# Configuración del proyecto para SonarQube Community (Self-Hosted)
# El scanner busca este archivo automáticamente en la raíz del repositorio
# =============================================================================

# Identificador único del proyecto en SonarQube (debe coincidir exactamente con el dashboard)
sonar.projectKey=Master-Gateway

# Nombre legible que aparece en el dashboard de SonarQube
sonar.projectName=Master-Gateway

# Versión del proyecto (actualizar con cada release)
sonar.projectVersion=1.0

# ── Código fuente a analizar ──────────────────────────────────────────────────
# Solo el código de la aplicación (no scripts de ML ni pipeline de entrenamiento)
sonar.sources=backend/app

# ── Carpeta de tests (para cobertura y test smells) ──────────────────────────
sonar.tests=backend/tests

# ── Lenguaje ─────────────────────────────────────────────────────────────────
sonar.language=py
sonar.python.version=3.11

# ── Exclusiones (archivos que NO se deben analizar) ──────────────────────────
sonar.exclusions=\
  **/alembic/versions/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/pipeline/**,\
  **/scripts/**,\
  **/.git/**,\
  **/node_modules/**

# ── Encoding ─────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Cobertura de Tests (pytest-cov) ──────────────────────────────────────────
# El reporte lo genera el pipeline con: pytest --cov=app --cov-report=xml:coverage.xml
# La ruta es relativa a la raíz del repositorio (donde corre el scanner)
sonar.python.coverage.reportPaths=backend/coverage.xml

# ── Definición de "New Code" ──────────────────────────────────────────────────
# Configurar en la UI de SonarQube: Project Settings → New Code → "Number of days: 1"
# sonar.newCode.referenceBranch NO está disponible en Community Edition (requiere Developer+)
